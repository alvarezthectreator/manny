<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101210" />
  <title>Forgot password | Cladvest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="auth.css?v=20261106-password-reset" />
</head>
<body class="site-page login-page">
  <header class="site-header wrap"><a class="site-logo" href="index.html"><span class="brand-symbol"><i data-lucide="arrow-up-right"></i></span>Cladvest</a><a class="back-link" href="login.html"><i data-lucide="arrow-left"></i> Back to sign in</a></header>
  <main class="login-main"><section class="login-panel" aria-labelledby="reset-request-title">
    <div class="login-mark"><span class="brand-symbol"><i data-lucide="key-round"></i></span></div><p class="kicker"><span></span> Account recovery</p><h1 id="reset-request-title">Reset your password.</h1><p class="login-subtitle">Enter your account email and we’ll send a reset link.</p>
    <form class="login-form" data-forgot-form><div class="field"><label for="reset-email">Email address</label><input class="control" id="reset-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required /></div><button class="button button-accent login-submit" type="submit">Send reset link <i data-lucide="arrow-right"></i></button></form>
    <p class="demo-note" data-reset-message role="status" aria-live="polite" hidden><i data-lucide="info"></i><span></span></p>
  </section></main>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="reset-password.js?v=20261106-password-reset"></script>
</body>
</html>
