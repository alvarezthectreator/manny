<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunities | Cladvest</title>
  <style>
    @layer theme, base, bootstrap, components, utilities;
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap");
    @import url("https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css") layer(bootstrap);
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="app-pages.css" />
</head>
<body data-page="Opportunities">
  <div id="app"><div class="page-body">
    <div class="page-heading"><div><div class="eyebrow">Explore</div><h1>Investment opportunities</h1><p>Choose an asset to review its details and estimate an investment from your available cash.</p></div><a class="button button-primary" href="add-funds.html">Add funds</a></div>
    <section class="panel opportunity-browser">
      <div class="opportunity-toolbar"><div><h2 class="panel-title mb-0">Browse assets</h2><p class="hint" data-opportunity-balance>Loading available cash...</p></div><div class="opportunity-filters"><input class="control" data-filter-input type="search" placeholder="Search name or symbol" aria-label="Search opportunities" /><select class="control" data-asset-type-filter aria-label="Filter by asset type"><option value="">All asset types</option><option value="stock">Stocks</option><option value="crypto">Crypto</option><option value="private_equity">Private companies</option><option value="other">Other assets</option></select></div></div>
      <div class="opportunity-grid" data-asset-list><p class="empty-state">Loading investment opportunities...</p></div>
    </section>
  </div></div>
  <script src="api-client.js"></script>
  <script src="app-pages.js"></script>
  <script src="auth-guard.js"></script>
</body>
</html>
