<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101210" />
  <title>Sign in | Cladvest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="site-page login-page">
  <header class="site-header wrap"><a class="site-logo" href="index.html"><span class="brand-symbol"><i data-lucide="arrow-up-right"></i></span>Cladvest</a><a class="back-link" href="index.html"><i data-lucide="arrow-left"></i> Back to home</a></header>
  <main class="login-main"><section class="login-panel" aria-labelledby="login-title">
    <div class="login-mark"><span class="brand-symbol"><i data-lucide="arrow-up-right"></i></span></div><p class="kicker"><span></span> Your workspace</p><h1 id="login-title">Welcome back.</h1><p class="login-subtitle" id="login-subtitle">Sign in to pick up where you left off.</p>
    <form class="login-form" id="login-form"><div class="field" id="name-field" hidden><label for="full-name">Full name</label><input id="full-name" name="name" type="text" autocomplete="name" placeholder="Your name" /></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" /></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" /></div><button class="button button-accent login-submit" type="submit"><span id="submit-label">Log in</span><i data-lucide="arrow-right"></i></button></form>
    <p class="demo-note"><i data-lucide="info"></i><span>Demo access only. Credentials are not checked or stored. Submit to open the sample dashboard.</span></p><p class="signup-prompt"><span id="mode-prompt">New to Cladvest?</span> <a id="mode-link" href="login.html?mode=signup">Create an account</a></p>
  </section></main>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="site.js"></script>
</body>
</html>
