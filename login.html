<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101210" />
  <title>Sign in | Cladvest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="auth.css?v=20261106-hidden-status" />
</head>
<body class="site-page login-page">
  <header class="site-header wrap"><a class="site-logo" href="index.html"><span class="brand-symbol"><i data-lucide="arrow-up-right"></i></span>Cladvest</a><a class="back-link" href="index.html"><i data-lucide="arrow-left"></i> Back to home</a></header>
  <main class="login-main"><section class="login-panel" aria-labelledby="login-title">
    <div class="login-mark"><span class="brand-symbol"><i data-lucide="arrow-up-right"></i></span></div><p class="kicker"><span></span> Your workspace</p><h1 id="login-title">Welcome back.</h1><p class="login-subtitle" id="login-subtitle">Sign in to pick up where you left off.</p>
    <form class="login-form" id="login-form"><div class="signup-details" id="signup-details" hidden><div class="field"><label for="first-name">First name</label><input id="first-name" name="first_name" type="text" autocomplete="given-name" maxlength="80" placeholder="First name" /></div><div class="field"><label for="last-name">Last name</label><input id="last-name" name="last_name" type="text" autocomplete="family-name" maxlength="80" placeholder="Last name" /></div><div class="field"><label for="phone-country-code">Phone country code <span>(optional)</span></label><input id="phone-country-code" name="phone_country_code" type="tel" autocomplete="tel-country-code" maxlength="8" placeholder="+1" /></div><div class="field"><label for="phone-number">Phone number <span>(optional)</span></label><input id="phone-number" name="phone_number" type="tel" autocomplete="tel-national" maxlength="32" placeholder="Phone number" /></div><div class="field"><label for="country-code">Country <span>(optional)</span></label><select id="country-code" name="country_code" autocomplete="country"><option value="">Select a country</option></select></div></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required /></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="4096" placeholder="Enter your password" required /></div><div class="field" id="confirm-password-field" hidden><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="4096" placeholder="Re-enter your password" /></div><button class="button button-accent login-submit" type="submit"><span id="submit-label">Log in</span><i data-lucide="arrow-right"></i></button></form>
    <p class="demo-note" id="auth-message" role="status" aria-live="polite" hidden><i data-lucide="info"></i><span></span></p><p class="signup-prompt"><a href="forgot-password.html">Forgot password?</a></p><p class="signup-prompt" id="signup-prompt"><span id="mode-prompt">New to Cladvest?</span> <a id="mode-link" href="login.html?mode=signup">Create an account</a></p><p class="signup-prompt" id="admin-login-prompt" hidden><span data-admin-prompt-label>Back to</span> <a data-admin-login-link href="login.html">User sign in</a></p>
  </section></main>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="site.js?v=20261106-hide-admin-link"></script>
</body>
</html>
