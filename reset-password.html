<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101210" />
  <title>Set new password | Cladvest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="auth.css?v=20261106-password-reset" />
</head>
<body class="site-page login-page">
  <header class="site-header wrap"><a class="site-logo" href="index.html"><span class="brand-symbol"><i data-lucide="arrow-up-right"></i></span>Cladvest</a><a class="back-link" href="login.html"><i data-lucide="arrow-left"></i> Back to sign in</a></header>
  <main class="login-main"><section class="login-panel" aria-labelledby="reset-title">
    <div class="login-mark"><span class="brand-symbol"><i data-lucide="key-round"></i></span></div><p class="kicker"><span></span> Account recovery</p><h1 id="reset-title">Set a new password.</h1><p class="login-subtitle">Choose a password with at least 12 characters.</p>
    <form class="login-form" data-reset-form><div class="field"><label for="new-password">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="4096" required /></div><div class="field"><label for="confirm-new-password">Confirm password</label><input id="confirm-new-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="4096" required /></div><button class="button button-accent login-submit" type="submit">Update password <i data-lucide="arrow-right"></i></button></form>
    <p class="demo-note" data-reset-message role="status" aria-live="polite" hidden><i data-lucide="info"></i><span></span></p>
  </section></main>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="reset-password.js?v=20261106-password-reset"></script>
</body>
</html>
